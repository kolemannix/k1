- title: Provide the programmer power and control; do not take it away
  body: k1 is designed around what it makes possible, not what it prevents, with a focus on freedom, control, and speed, while also providing advanced features, rather than punting on them, to empower programmers to make their programs exactly what they want them to be, not what the language wants them to be.
- title: Compile fast
  body: "Shortening the feedback cycle preserves flow and greatly increases joy. It literally temporally enables more iterations, and iterations are where quality is improved. Faster builds directly cause in higher quality programs."
- title: Your programs should be as fast as your computer is
  body: "A career spent programming on the JVM made me loathe inescapable costs. There are many fantastic programming idioms that can be free, such as newtypes, lambdas, even something as simple as a flat struct, which many languages lack in favor of a boxed class as the primary unit of computation. The mere presence of linear data layout in Go was enough to motivate the Typescript compiler's rewrite. Boxed data, functions, and other expensive constructs as *defaults* are a huge mistake; it forces the programmer to choose between something typesafe and idiomatic, or something fast. You end up doing metaprogramming heroics to implement an allocation-free Option type in Scala, or managing your own memory in Java (See: Netty)."
- title: Metaprogramming should be the same as programming
  body: "Compile-time execution and reflection enables powerful metaprogramming that is just regular programming, which you are already good at. Outputting source code text is actually pretty easy."
- title: data is just data
  body: "De-coupling data from behavior allows for huge efficiency gains, free serialization, and discourages convoluted structure. Cleanup is zeroing memory without asking it for permission first, avoiding costly recursive drop glue. Instead we run `defer`ed code in plain sight"
- title: No forced abstractions, no forced costs
  body: "Pay for what you use, and use what you want. And what you use costs as little as possible. This is Rust's definition of 'zero-cost' functionality. I think it holds up and is a fantastic north star. Yes, there is a cost. Usually it paid in increased compile times. `k1` takes that battle very seriously."
- title: Abilities, not inheritance
  body: "k1's ability system, which is an implementation of typeclasses, ad-hoc polymorphism, allows for late-bound, 3rd-party provision of data with behavior, which is how you can have interfaces and generic programs without going insane. Keep Data Dumb"
