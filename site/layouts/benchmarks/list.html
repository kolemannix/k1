{{ define "main" }}
<main class="page"><div class="wrap">
  <h1>{{ .Title }}</h1>
  <div class="body">
    {{ with .Content }}<div class="intro">{{ . }}</div>{{ end }}
    {{ range .Pages.ByWeight }}
    <section class="suite" id="{{ .File.ContentBaseName }}">
      <h2>{{ .Title }}</h2>
      {{ range .Params.charts }}{{ partial "chart.html" . }}{{ end }}
      {{ .Content }}
      {{ partial "provenance.html" . }}
    </section>
    {{ end }}
  </div>
</div></main>
{{ end }}
