<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>refchess perft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #0E1013;
    --panel: #151920;
    --panel-2: #1B2028;
    --line: #262B34;
    --muted: #7E8794;
    --fore: #E6E9EE;
    --white: #FFFFFF;
    --gold: #E6C070;
    --success: #8FC9A0;
    --fail: #D9806A;
    --light-square: #1F2530;
    --mono: "Martian Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --prose: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 16px;
    background: var(--ground);
    color: var(--fore);
    font: 15px/1.5 var(--prose);
  }
  main { width: min(100%, 384px); display: flex; flex-direction: column; gap: 18px; }
  #board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    aspect-ratio: 1;
    border: 1px solid var(--line);
    user-select: none;
  }
  #board div {
    display: grid;
    place-items: center;
    font-size: 30px;
    line-height: 1;
    color: var(--fore);
    background: var(--panel-2);
  }
  #board div.light { background: var(--light-square); }
  #board div.moved { background: var(--gold); color: var(--ground); }
  #track { height: 3px; background: var(--line); margin-top: -18px; }
  #bar { height: 100%; width: 0; background: var(--gold); transition: width 60ms linear; }
  #bar.bad { background: var(--fail); }
  #status {
    display: grid;
    gap: 2px;
    font: 0.8rem/1.5 var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  #status > span { display: block; min-height: 1.5em; }
  #status .n { color: var(--fore); }
  #status .ok { color: var(--success); }
  #status .bad { color: var(--fail); }
  p a { color: var(--fore); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  p a:hover { text-decoration-color: var(--muted); }
  #actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .button {
    font: 0.75rem/1 var(--mono);
    padding: .55rem 1rem;
    border-radius: 2px;
    border: 1px solid var(--gold);
    background: var(--gold);
    color: var(--ground);
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .button:disabled { cursor: default; opacity: .7; }
  .button.secondary { background: transparent; border-color: var(--line); color: var(--fore); }
  .button.secondary:hover { border-color: var(--muted); }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div id="board"></div>
  <div id="track"><div id="bar"></div></div>
  <div id="status"><span id="count"></span><span id="verdict"></span></div>
  <div id="actions">
    <button id="run" class="button" disabled>Loading</button>
    <a class="button secondary" href="examples/refchess/perft.k1">[ source ]</a>
  </div>
  <p><a href="https://chessprogramming.org/Perft">Perft</a> counts legal moves to depth 6. There is exactly one right answer.</p>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
