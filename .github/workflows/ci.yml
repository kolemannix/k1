name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_SYS_231_PREFIX: /usr/lib/llvm-23
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM 23
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          sudo apt-get install -y llvm-23-dev liblld-23-dev libclang-23-dev ripgrep
          rm llvm.sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: ./test.sh

      - name: Binding drift from module setups
        if: failure()
        run: git --no-pager diff --stat && git --no-pager diff modules/ | head -400
